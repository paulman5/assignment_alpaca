[package]
name = "orders_lite"
version = "0.1.0"
description = "Stripped spoutOrders order lifecycle for the backend take-home — place/fulfill/refund, no KYC/oracle/escrow"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
